<!DOCTYPE html>
<html lang="pt" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jailson</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: '#0a0a0f',
            card: '#111118',
            border: '#1e1e2e',
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 3px; }

    .md p { margin-bottom: 0.5rem; }
    .md p:last-child { margin-bottom: 0; }
    .md ul { list-style: disc; padding-left: 1.5rem; margin-bottom: 0.5rem; }
    .md ol { list-style: decimal; padding-left: 1.5rem; margin-bottom: 0.5rem; }
    .md li { margin-bottom: 0.25rem; }
    .md code { background: #1a1a28; padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.85em; color: #7dd3fc; }
    .md pre { background: #1a1a28; padding: 1rem; border-radius: 8px; overflow-x: auto; margin-bottom: 0.5rem; }
    .md pre code { background: none; padding: 0; color: #e2e8f0; }
    .md h1, .md h2, .md h3 { font-weight: 600; margin-bottom: 0.4rem; color: #e2e8f0; }
    .md h1 { font-size: 1.2em; }
    .md h2 { font-size: 1.1em; }
    .md strong { font-weight: 600; color: #e2e8f0; }
    .md em { color: #94a3b8; }
    .md table { border-collapse: collapse; width: 100%; margin-bottom: 0.5rem; font-size: 0.9em; }
    .md th, .md td { border: 1px solid #2a2a3e; padding: 0.4rem 0.75rem; text-align: left; }
    .md th { background: #1a1a28; color: #94a3b8; font-weight: 500; }
    .md a { color: #22d3ee; text-decoration: underline; }
    .md blockquote { border-left: 3px solid #2a2a3e; padding-left: 1rem; color: #64748b; margin-bottom: 0.5rem; }
    .md hr { border-color: #1e1e2e; margin: 0.75rem 0; }

    .cursor-blink::after { content: '▋'; animation: blink 0.9s infinite; color: #22d3ee; font-size: 0.9em; }
    @keyframes blink { 0%,45% { opacity: 1; } 55%,100% { opacity: 0; } }

    .fade-in { animation: fadeUp 0.18s ease-out; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="h-full bg-surface text-gray-200 flex flex-col" style="font-family:'Segoe UI',system-ui,sans-serif;">

  <!-- Header -->
  <header class="flex-shrink-0 flex items-center justify-between px-5 py-3 bg-card border-b border-border">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-1.5">
        <div id="dot" class="w-2 h-2 rounded-full bg-emerald-500"></div>
        <span class="text-cyan-400 font-mono font-bold tracking-[0.2em] text-base">JAILSON</span>
      </div>
      <span class="text-gray-600 text-sm hidden sm:block">— Agente Pessoal de PC</span>
    </div>
    <div class="flex items-center gap-1">
      <button onclick="showStats()" class="px-3 py-1.5 text-xs text-gray-500 hover:text-cyan-400 hover:bg-border rounded-lg transition-all">/stats</button>
      <button onclick="doReset()" class="px-3 py-1.5 text-xs text-gray-500 hover:text-amber-400 hover:bg-border rounded-lg transition-all">/reset</button>
    </div>
  </header>

  <!-- Messages -->
  <div id="msgs" class="flex-1 overflow-y-auto px-4 py-5 space-y-5">
    <div class="fade-in flex gap-3 max-w-2xl" id="welcome">
      <div class="w-7 h-7 rounded-full bg-cyan-950 border border-cyan-800 flex-shrink-0 flex items-center justify-center text-cyan-400 text-[10px] font-bold mt-0.5">J</div>
      <div class="flex-1 min-w-0">
        <div class="text-[10px] text-cyan-600 mb-1 font-semibold tracking-wide uppercase">Jailson</div>
        <div class="bg-card border border-border rounded-2xl rounded-tl-sm px-4 py-3 text-sm text-gray-300 md">
          <p>Olá! Sou o <strong>Jailson</strong>, o teu agente pessoal de PC.</p>
          <p>Podes falar naturalmente comigo ou usar comandos como <code>/pc</code>, <code>/imagem</code>, <code>/memoria</code>, <code>/pesquisar</code>.</p>
          <p>Como posso ajudar?</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick commands -->
  <div class="flex-shrink-0 px-4 pb-2 flex gap-2 flex-wrap">
    <button onclick="setInput('/pc ')" class="chip">/pc</button>
    <button onclick="setInput('/imagem ')" class="chip">/imagem</button>
    <button onclick="setInput('/memoria ')" class="chip">/memoria</button>
    <button onclick="setInput('/pesquisar ')" class="chip">/pesquisar</button>
    <button onclick="send('/stats')" class="chip">/stats</button>
  </div>

  <!-- Input -->
  <div class="flex-shrink-0 px-4 pb-4">
    <div class="flex gap-2 items-end bg-card border border-border rounded-2xl px-4 py-3 focus-within:border-cyan-900 transition-colors">
      <textarea
        id="inp"
        rows="1"
        placeholder="Escreve aqui…"
        class="flex-1 bg-transparent outline-none resize-none text-sm text-gray-200 placeholder-gray-700 leading-relaxed"
        onkeydown="onKey(event)"
        oninput="grow(this)"
      ></textarea>
      <button id="btn" onclick="send()" class="flex-shrink-0 w-8 h-8 rounded-xl bg-cyan-700 hover:bg-cyan-600 disabled:bg-gray-800 disabled:cursor-not-allowed flex items-center justify-center transition-colors">
        <svg viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4">
          <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z"/>
        </svg>
      </button>
    </div>
    <p class="text-center text-gray-800 text-[11px] mt-1.5">Enter para enviar · Shift+Enter para nova linha</p>
  </div>

  <!-- Stats modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 px-4" onclick="closeModal(event)">
    <div class="bg-card border border-border rounded-2xl p-6 w-full max-w-xs">
      <h2 class="text-cyan-400 font-mono font-bold text-sm tracking-wide mb-4">ESTATÍSTICAS DE MEMÓRIA</h2>
      <div id="stats-body" class="space-y-2.5 text-sm"></div>
      <button onclick="document.getElementById('modal').classList.add('hidden')" class="mt-5 w-full py-2 text-xs text-gray-600 hover:text-gray-300 transition-colors rounded-lg hover:bg-border">Fechar</button>
    </div>
  </div>

  <style>
    .chip { padding: 0.2rem 0.75rem; font-size: 0.7rem; background: #111118; border: 1px solid #1e1e2e; color: #4b5563; border-radius: 9999px; transition: all 0.15s; cursor: pointer; }
    .chip:hover { color: #22d3ee; border-color: #164e63; }
    .tool-pill { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.2rem 0.6rem; background: rgba(120,90,0,0.15); border: 1px solid rgba(180,130,0,0.25); border-radius: 9999px; color: #d97706; font-size: 0.7rem; margin-bottom: 0.3rem; }
  </style>

  <script>
    marked.setOptions({ breaks: true });

    let busy = false;
    let activeMsgId = null;
    let activeText = '';
    let activeBubble = null;

    function grow(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 150) + 'px';
    }

    function onKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    }

    function scrollDown() {
      const el = document.getElementById('msgs');
      el.scrollTop = el.scrollHeight;
    }

    function setInput(val) {
      const inp = document.getElementById('inp');
      inp.value = val;
      inp.focus();
      grow(inp);
    }

    function esc(t) {
      return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function addUser(text) {
      const msgs = document.getElementById('msgs');
      const d = document.createElement('div');
      d.className = 'fade-in flex justify-end';
      d.innerHTML = `<div class="max-w-lg"><div class="bg-cyan-950/50 border border-cyan-900/40 rounded-2xl rounded-tr-sm px-4 py-3 text-sm text-gray-200 whitespace-pre-wrap leading-relaxed">${esc(text)}</div></div>`;
      msgs.appendChild(d);
      scrollDown();
    }

    function addJailson() {
      const msgs = document.getElementById('msgs');
      const id = 'jm' + Date.now();
      const d = document.createElement('div');
      d.id = id;
      d.className = 'fade-in flex gap-3 max-w-2xl';
      d.innerHTML = `
        <div class="w-7 h-7 rounded-full bg-cyan-950 border border-cyan-800 flex-shrink-0 flex items-center justify-center text-cyan-400 text-[10px] font-bold mt-0.5">J</div>
        <div class="flex-1 min-w-0">
          <div class="text-[10px] text-cyan-600 mb-1 font-semibold tracking-wide uppercase">Jailson</div>
          <div id="${id}-c" class="space-y-1.5"></div>
        </div>`;
      msgs.appendChild(d);
      scrollDown();
      return id;
    }

    function addTool(id, name) {
      sealBubble();
      const c = document.getElementById(id + '-c');
      const p = document.createElement('div');
      p.className = 'tool-pill';
      p.innerHTML = `<svg class="w-3 h-3 spin" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-20"/><path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" class="opacity-75"/></svg>${esc(name)}`;
      c.appendChild(p);
      scrollDown();
    }

    function getOrMakeBubble(id) {
      if (!activeBubble) {
        const c = document.getElementById(id + '-c');
        activeBubble = document.createElement('div');
        activeBubble.className = 'bg-card border border-border rounded-2xl rounded-tl-sm px-4 py-3 text-sm text-gray-300 md leading-relaxed cursor-blink';
        c.appendChild(activeBubble);
      }
      return activeBubble;
    }

    function appendChunk(id, chunk) {
      activeText += chunk;
      const b = getOrMakeBubble(id);
      b.innerHTML = marked.parse(activeText);
      scrollDown();
    }

    function sealBubble() {
      if (activeBubble) {
        activeBubble.classList.remove('cursor-blink');
        activeBubble = null;
        activeText = '';
      }
    }

    async function send(overrideMsg) {
      if (busy) return;
      const inp = document.getElementById('inp');
      const msg = overrideMsg ?? inp.value.trim();
      if (!msg) return;

      inp.value = '';
      inp.style.height = 'auto';
      document.getElementById('btn').disabled = true;
      busy = true;

      addUser(msg);
      const id = addJailson();
      activeBubble = null;
      activeText = '';

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg }),
        });

        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const raw = line.slice(6);
            if (raw === '[DONE]') break;
            try {
              const { chunk } = JSON.parse(raw);
              if (chunk.includes('[Usando:')) {
                const name = chunk.match(/\[Usando:\s*(.+?)\.\.\.\]/)?.[1] ?? 'ferramenta';
                addTool(id, name);
              } else if (!chunk.includes('[Pensando')) {
                appendChunk(id, chunk);
              }
            } catch { /* malformed line */ }
          }
        }
      } catch (e) {
        const c = document.getElementById(id + '-c');
        c.innerHTML += `<div class="text-red-500 text-sm">Erro: ${esc(e.message)}</div>`;
      } finally {
        sealBubble();
        document.getElementById('btn').disabled = false;
        busy = false;
        document.getElementById('inp').focus();
      }
    }

    async function showStats() {
      try {
        const d = await (await fetch('/stats')).json();
        document.getElementById('stats-body').innerHTML = `
          <div class="flex justify-between text-gray-400"><span class="text-gray-600">Sessão</span><span class="font-mono text-xs">${d.session_id ?? '-'}</span></div>
          <div class="flex justify-between text-gray-400"><span class="text-gray-600">Short-term</span><span>${d.short_term ?? 0} entradas</span></div>
          <div class="flex justify-between text-gray-400"><span class="text-gray-600">Sagrada</span><span>${d.sacred ?? 0} entradas</span></div>
          <div class="flex justify-between text-gray-400"><span class="text-gray-600">Semântica</span><span>${d.semantic ?? 0} docs</span></div>`;
        document.getElementById('modal').classList.remove('hidden');
      } catch(e) { alert('Erro: ' + e.message); }
    }

    function closeModal(e) {
      if (e.target === document.getElementById('modal'))
        document.getElementById('modal').classList.add('hidden');
    }

    async function doReset() {
      if (!confirm('Limpar conversa? (A memória é preservada)')) return;
      await fetch('/reset', { method: 'POST' });
      const msgs = document.getElementById('msgs');
      msgs.innerHTML = '';
      activeBubble = null; activeText = '';
      const d = document.createElement('div');
      d.className = 'fade-in flex gap-3 max-w-2xl';
      d.innerHTML = `
        <div class="w-7 h-7 rounded-full bg-cyan-950 border border-cyan-800 flex-shrink-0 flex items-center justify-center text-cyan-400 text-[10px] font-bold mt-0.5">J</div>
        <div class="flex-1 min-w-0">
          <div class="text-[10px] text-cyan-600 mb-1 font-semibold tracking-wide uppercase">Jailson</div>
          <div class="bg-card border border-border rounded-2xl rounded-tl-sm px-4 py-3 text-sm text-gray-300 md"><p>Conversa reiniciada. Memória preservada. Como posso ajudar?</p></div>
        </div>`;
      msgs.appendChild(d);
    }

    document.getElementById('inp').focus();
  </script>
</body>
</html>
